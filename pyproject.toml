[project]
name = "nfc-reader"
version = "0.1.0"
description = "NFC Reader"
authors = [
    {name = "trbouma",email = "trbouma@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "monstr (>=0.1.9,<0.2.0)",
    "nfcpy (>=1.0.4,<2.0.0)",
    "pyscard (>=2.2.2,<3.0.0)",
    "bech32 (>=1.2.0,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "face-recognition (>=1.3.0,<2.0.0)",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
